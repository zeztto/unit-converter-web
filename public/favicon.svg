<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#030213"/>

  <!-- Calculator icon with unit symbols -->
  <g transform="translate(20, 20)">
    <!-- Main calculator body -->
    <rect x="5" y="10" width="50" height="50" rx="4" fill="#ffffff" opacity="0.15"/>

    <!-- Display area -->
    <rect x="10" y="15" width="40" height="12" rx="2" fill="#ffffff" opacity="0.3"/>

    <!-- Unit conversion arrows -->
    <g transform="translate(30, 21)">
      <!-- Right arrow -->
      <path d="M 0 0 L 6 3 L 0 6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left arrow -->
      <path d="M 8 0 L 2 3 L 8 6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Unit symbols -->
    <text x="12" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">m</text>
    <text x="32" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">kg</text>

    <text x="12" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">°C</text>
    <text x="32" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">L</text>
  </g>

  <!-- Accent circle (modern touch) -->
  <circle cx="75" cy="25" r="8" fill="#4f46e5" opacity="0.8"/>
  <text x="75" y="29" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">↔</text>
</svg>
